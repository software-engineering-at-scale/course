name: Exercise or scenario proposal
description: Propose a realistic change, failure, or operational exercise for the course.
title: "[Scenario]: "
labels:
  - scenario
body:
  - type: textarea
    id: situation
    attributes:
      label: Situation
      description: What inherited system condition, request, or failure begins the exercise?
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Learning objective
      description: What should students learn that they would not learn from a clean implementation task?
    validations:
      required: true
  - type: textarea
    id: student_material
    attributes:
      label: Student-visible material
      description: What information, constraints, and artifacts do students initially receive?
    validations:
      required: true
  - type: textarea
    id: withheld
    attributes:
      label: Withheld or instructor-controlled material
      description: What tests, facts, consequences, or observations are revealed later, and why?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence of learning
      description: What student behavior or artifact would demonstrate the intended learning?
    validations:
      required: true
